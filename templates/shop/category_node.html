{% if cat.tree_children %}<details class="category-branch" {% if cat.tree_open %}open{% endif %}><summary><a class="category-nav-item" href="?category={{ cat.slug|urlencode }}{% if category_query %}&amp;{{ category_query }}{% endif %}" {% if cat.slug == selected_category %}aria-current="page"{% endif %}><span>{{ cat.name }}</span><small>{{ cat.count }}</small></a><span class="category-toggle" aria-hidden="true"></span></summary><div class="category-children">{% for child in cat.tree_children %}{% include 'shop/category_node.html' with cat=child %}{% endfor %}</div></details>{% else %}<a class="category-nav-item" href="?category={{ cat.slug|urlencode }}{% if category_query %}&amp;{{ category_query }}{% endif %}" {% if cat.slug == selected_category %}aria-current="page"{% endif %}><span>{{ cat.name }}</span><small>{{ cat.count }}</small></a>{% endif %}
